<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>pingloo_wings_game_v01</title>

<!-- 1. Подключаем CreateJS -->
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<!-- 2. Подключаем сгенерированный скрипт графики Animate -->
<script src="pingloo_wings_game_v01.js"></script>
<!-- 3. Подключаем нашу физику и логику -->
<script src="game.js"></script>

<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;

function init() {
	canvas = document.getElementById("canvas");
	anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	
	var comp = AdobeAn.getComposition("093CAE4089B7BC4AAACFDD8677457120");
	var lib = comp.getLibrary();
	
	// ВАЖНО: Создаем загрузчик, который берет манифест из библиотеки Animate и скачивает картинки из папки images/
	var loader = new createjs.LoadQueue(false);
	loader.on("progress", function(evt) {
    let percent = Math.round(evt.progress * 100);
    // Здесь можно менять текст на экране загрузки: "Загрузка: " + percent + "%"
	});
	loader.addEventListener("fileload", function(evt) { handleFileLoad(evt, comp); });
	loader.addEventListener("complete", function(evt) { handleComplete(evt, comp); });
	loader.loadManifest(lib.properties.manifest);
}

function handleFileLoad(evt, comp) {
	var images = comp.getImages();
	if (evt && (evt.item.type == "image")) {
		images[evt.item.id] = evt.result;
	}
}

function handleComplete(evt, comp) {
	var lib = comp.getLibrary();
	var ss = comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	
	for(i=0; i<ssMetadata.length; i++) {
		ss[ssMetadata[i].name] = new createjs.SpriteSheet({
			"images": [queue.getResult(ssMetadata[i].name)],
			"frames": ssMetadata[i].frames
		});
	}
	
	exportRoot = new lib.pingloo_wings_game_v01();
	stage = new lib.Stage(canvas);
	
	fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	}	    
	
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
	
	// Запускаем нашу адаптивность и автоповорот после инициализации сцены
	if (typeof window.handleResize === 'function') {
		window.handleResize();
	}
}
</script>

<style>
  html, body { 
    width: 100%; 
    height: 100%; 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    background-color: #A8E8E6; 
  }
</style>
</head>
<body onload="init();" style="margin:0px;">
	<div id="animation_container" style="background-color:rgba(255, 255, 255, 1.00); width:1920px; height:1080px">
		<canvas id="canvas" width="1920" height="1080" style="position: absolute; display: block; background-color:rgba(255, 255, 255, 1.00);"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:1920px; height:1080px; position: absolute; left: 0px; top: 0px; display: block;">
		</div>
	</div>
</body>
</html>
