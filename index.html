        <!-- 1. Скрытый блок для форсированной загрузки шрифта в кэш -->
    <div style="font-family: 'PinglooFont'; position: absolute; left: -9999px; visibility: hidden;">preload</div>

    <!-- 2. HTML-Прелоадер игры (Минимализм) -->
    <div id="game-preloader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #80C5FA; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'PinglooFont', sans-serif; color: white; transition: opacity 0.5s ease;">
        <div id="preloader-text" style="font-size: 60px; text-align: center;">LOADING...</div>
    </div>

    <!-- 3. Экран требования поворота (Orientation Lock) -->
    <div id="orientation-lock" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #80C5FA; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: 'PinglooFont', sans-serif;">
        <div style="font-size: 60px; text-align: center; line-height: 1.2;">PLEASE<br>ROTATE<br>DEVICE</div>
    </div>

    <script>
        function checkOrientation() {
            var lockScreen = document.getElementById('orientation-lock');
            // Если экран узкий (портретный) и это мобилка
            if (window.innerHeight > window.innerWidth && isMobile) {
                lockScreen.style.display = 'flex'; // Показываем черную заглушку
                // Опционально: ставим игру на паузу, если она шла
                if (typeof isPlaying !== 'undefined' && isPlaying) {
                    isPlaying = false; 
                    if (currentBgmInstance) currentBgmInstance.paused = true;
                    // Если есть экран паузы в игре, лучше вызвать его
                    if (typeof gameRoot !== 'undefined' && gameRoot.btnPause) {
                        gameRoot.btnPause.emit('pointerdown');
                    }
                }
            } else {
                lockScreen.style.display = 'none'; // Убираем заглушку
            }
        }
        
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        // Запускаем при загрузке
        window.addEventListener('load', checkOrientation);
    </script>

        <canvas id="stage" width="1920" height="1080"></canvas>
        
        <!-- Библиотеки Pixi -->
        <script src="libs/pixi.js"></script>
        <script src="libs/pixi-animate.js"></script>
        <script src="pingloo_wings_game_v02.js"></script>
        
        <!-- Твоя игровая логика -->
        <script src="game.js"></script>
        
        <script>
            var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            // На ПК максимум (2), на смартфонах - 1.25
            var dpr = isMobile ? 1.25 : Math.min(window.devicePixelRatio || 1, 2);

            var gameScene = new PIXI.animate.Scene(1920, 1080, {
                view: document.getElementById("stage"),
                backgroundColor: 0x000000,
                antialias: !isMobile,
                resolution: dpr 
            });

            // Сразу загружаем библиотеку и стартуем игру (Без процентов)
            gameScene.load(lib.pingloo_wings_game_v02, function(instance) {
                if (typeof window.initGame === 'function') {
                    window.initGame(instance, gameScene);
                }
            });
        </script>
